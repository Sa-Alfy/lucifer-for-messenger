<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucifer Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1rem;
      background: #0f1117;
      color: #e6e6e6;
      min-height: 100vh;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 1.5rem; }
    nav {
      display: flex;
      gap: 1.25rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #333;
      align-items: center;
    }
    nav button {
      background: none;
      border: none;
      color: #999;
      padding: 0.6rem 0;
      cursor: pointer;
      font-size: 0.95rem;
    }
    nav button:hover { color: #ccc; }
    nav button.active { color: #fff; border-bottom: 2px solid #5b8def; margin-bottom: -1px; }
    nav .logout-btn { margin-left: auto; color: #888; }
    nav .logout-btn:hover { color: #e57373; }
    .panel { display: none; }
    .panel.active { display: block; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td {
      text-align: left;
      padding: 0.6rem 0.5rem;
      border-bottom: 1px solid #2a2a2a;
      font-size: 0.9rem;
    }
    th { color: #999; font-weight: 500; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; }
    .toggle {
      padding: 0.35rem 0.85rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .on { background: #2e7d32; color: white; }
    .off { background: #555; color: #ccc; }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .stat-card {
      background: #1a1d27;
      padding: 1.25rem;
      border-radius: 8px;
      border: 1px solid #2a2d3a;
    }
    .stat-card .value { font-size: 1.8rem; font-weight: 600; }
    .stat-card .label { color: #999; font-size: 0.85rem; margin-top: 0.25rem; }
    .persona-section { margin-top: 2rem; }
    .persona-section h3 { font-size: 0.95rem; color: #999; margin-bottom: 0.75rem; }
    .users-toolbar {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }
    .users-toolbar input {
      background: #1a1d27;
      border: 1px solid #333;
      color: #eee;
      padding: 0.45rem 0.65rem;
      border-radius: 4px;
      min-width: 200px;
    }
    .users-toolbar label { font-size: 0.9rem; color: #aaa; cursor: pointer; }
    .block-btn { background: #c62828; color: white; }
    .unblock-btn { background: #555; color: #ccc; }
    .empty { color: #666; font-size: 0.9rem; margin-top: 1rem; }
    .pagination { margin-top: 1rem; display: flex; gap: 0.75rem; align-items: center; font-size: 0.9rem; color: #999; }
    .pagination button {
      background: #1a1d27;
      border: 1px solid #333;
      color: #eee;
      padding: 0.35rem 0.75rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .pagination button:disabled { opacity: 0.4; cursor: default; }
    /* yt-dlp staleness banner */
    .ytdlp-banner {
      display: none;
      background: #7c5500;
      border: 1px solid #b07800;
      border-radius: 6px;
      padding: 0.65rem 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      color: #ffe5a0;
    }
    .ytdlp-banner.visible { display: block; }
    .ytdlp-banner strong { color: #ffd060; }
  </style>
</head>
<body>
  <!-- yt-dlp staleness warning banner (hidden until JS confirms stale) -->
  <div id="ytdlp-banner" class="ytdlp-banner" role="alert">
    ⚠️ <strong>yt-dlp may be outdated.</strong>
    <span id="ytdlp-banner-detail"></span>
    Redeploy the service to update it.
  </div>
  <h1>Lucifer — Admin Dashboard</h1>
  <nav>
    <button class="tab-btn active" data-panel="flags">Flags</button>
    <button class="tab-btn" data-panel="stats">Stats</button>
    <button class="tab-btn" data-panel="users">Users</button>
    <button class="logout-btn" onclick="logout()">Log out</button>
  </nav>

  <div id="flags" class="panel active">
    <table id="flags-table"></table>
  </div>

  <div id="stats" class="panel">
    <div class="stat-grid" id="stats-grid"></div>
    <div class="persona-section">
      <h3>Persona distribution</h3>
      <table id="persona-table"></table>
    </div>
  </div>

  <div id="users" class="panel">
    <div class="users-toolbar">
      <input id="user-search" placeholder="Search PSID...">
      <label><input type="checkbox" id="blocked-only"> Blocked only</label>
    </div>
    <table id="users-table"></table>
    <div class="pagination" id="users-pagination"></div>
  </div>

  <script>
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.panel).classList.add('active');
        if (btn.dataset.panel === 'stats') loadStats();
        if (btn.dataset.panel === 'users') loadUsers();
      };
    });

    async function api(path, options = {}) {
      const res = await fetch(path, { credentials: 'same-origin', ...options });
      if (res.status === 401) { window.location.href = '/admin/login'; return null; }
      return res.json();
    }

    async function loadFlags() {
      const data = await api('/admin/api/flags');
      if (!data) return;
      if (!data.flags.length) {
        document.getElementById('flags-table').innerHTML = '<tr><td class="empty">No flags found.</td></tr>';
        return;
      }
      document.getElementById('flags-table').innerHTML =
        '<tr><th>Flag</th><th>Status</th></tr>' +
        data.flags.map(f => `
          <tr>
            <td>${escapeHtml(f.key)}</td>
            <td>
              <button class="toggle ${f.enabled ? 'on' : 'off'}" onclick="toggleFlag('${escapeAttr(f.key)}')">
                ${f.enabled ? 'ON' : 'OFF'}
              </button>
            </td>
          </tr>`).join('');
    }

    async function toggleFlag(key) {
      await api(`/admin/api/flags/${encodeURIComponent(key)}/toggle`, { method: 'POST' });
      loadFlags();
    }

    async function loadStats() {
      const data = await api('/admin/api/stats');
      if (!data) return;
      const cards = [
        ['Total Users', data.total_users],
        ['New Today', data.new_today],
        ['Active (7d)', data.active_last_7_days],
        ['Messages Today', data.messages_today],
        ['Blocked', data.blocked_users],
        ['Admins', data.admin_users],
      ];
      document.getElementById('stats-grid').innerHTML = cards.map(([l, v]) =>
        `<div class="stat-card"><div class="value">${v ?? 0}</div><div class="label">${l}</div></div>`
      ).join('');

      const personas = data.persona_distribution || {};
      const entries = Object.entries(personas);
      document.getElementById('persona-table').innerHTML = entries.length
        ? '<tr><th>Persona</th><th>Count</th></tr>' +
          entries.map(([p, c]) => `<tr><td>${escapeHtml(p)}</td><td>${c}</td></tr>`).join('')
        : '<tr><td class="empty">No users yet.</td></tr>';
    }

    let currentPage = 1;

    async function loadUsers() {
      const params = new URLSearchParams({
        page: currentPage,
        search: document.getElementById('user-search').value,
        blocked_only: document.getElementById('blocked-only').checked,
      });
      const data = await api(`/admin/api/users?${params}`);
      if (!data) return;

      const totalPages = Math.max(1, Math.ceil(data.total / data.page_size));
      document.getElementById('users-table').innerHTML =
        '<tr><th>PSID</th><th>Persona</th><th>Msgs</th><th>Last Seen</th><th></th></tr>' +
        (data.users.length
          ? data.users.map(u => `
            <tr>
              <td>${escapeHtml(u.psid)}</td>
              <td>${escapeHtml(u.persona)}</td>
              <td>${u.message_count}</td>
              <td>${u.last_seen_at ? new Date(u.last_seen_at).toLocaleString() : '—'}</td>
              <td>
                <button class="toggle ${u.is_blocked ? 'unblock-btn' : 'block-btn'}"
                  onclick="toggleBlock('${escapeAttr(u.psid)}', ${!u.is_blocked})">
                  ${u.is_blocked ? 'Unblock' : 'Block'}
                </button>
              </td>
            </tr>`).join('')
          : '<tr><td colspan="5" class="empty">No users match.</td></tr>');

      document.getElementById('users-pagination').innerHTML = `
        <button ${currentPage <= 1 ? 'disabled' : ''} onclick="changePage(-1)">Prev</button>
        <span>Page ${data.page} of ${totalPages} (${data.total} total)</span>
        <button ${currentPage >= totalPages ? 'disabled' : ''} onclick="changePage(1)">Next</button>`;
    }

    function changePage(delta) {
      currentPage = Math.max(1, currentPage + delta);
      loadUsers();
    }

    async function toggleBlock(psid, block) {
      await api(`/admin/api/users/${encodeURIComponent(psid)}/${block ? 'block' : 'unblock'}`, { method: 'POST' });
      loadUsers();
    }

    function logout() {
      fetch('/admin/logout', { method: 'POST' }).then(() => { window.location.href = '/admin/login'; });
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function escapeAttr(s) {
      return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    document.getElementById('user-search').addEventListener('input', () => { currentPage = 1; loadUsers(); });
    document.getElementById('blocked-only').addEventListener('change', () => { currentPage = 1; loadUsers(); });

    loadFlags();

    // check yt-dlp staleness on page load and show banner if needed
    async function checkYtdlpFreshness() {
      const data = await api('/admin/api/ytdlp');
      if (!data) return;
      const banner = document.getElementById('ytdlp-banner');
      const detail = document.getElementById('ytdlp-banner-detail');
      if (data.is_stale) {
        detail.textContent = `Version ${data.version} is ${data.age_days} days old (threshold: ${data.stale_threshold_days}d). `;
        banner.classList.add('visible');
      } else if (data.error) {
        detail.textContent = `${data.error} `;
        banner.classList.add('visible');
      }
    }
    checkYtdlpFreshness();
  </script>
</body>
</html>
