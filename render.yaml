services:
  - type: web
    name: messenger-ai-assistant
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz

    envVars:
      # ── Core Databases ────────────────────────────────────────
      - key: DATABASE_URL
        sync: false           # set manually in Render dashboard
      - key: REDIS_URL
        sync: false

      # ── Runtime ───────────────────────────────────────────────
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: "8000"

      # ── Facebook Messenger ────────────────────────────────────
      - key: FB_PAGE_ACCESS_TOKEN
        sync: false
      - key: FB_APP_SECRET
        sync: false
      - key: FB_VERIFY_TOKEN
        sync: false
      - key: FB_PAGE_ID
        sync: false

      # ── AI Providers (Groq, Gemini, Hugging Face) ─────────────
      - key: GROQ_API_KEY
        sync: false
      - key: HF_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # ── Supabase Image & Video Storage ────────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # ── Utilities (OpenWeatherMap, etc.) ──────────────────────
      - key: OPENWEATHER_API_KEY
        sync: false

      # ── Admin Panel ───────────────────────────────────────────
      - key: ADMIN_BOOTSTRAP_SECRET
        sync: false    # remove from here once the first admin has been claimed
      - key: ADMIN_DASHBOARD_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false

      # ── Observability & Monitoring ────────────────────────────
      - key: SENTRY_DSN
        sync: false    # optional; leave empty to disable Sentry entirely
